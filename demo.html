        /* Basic Layout Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Filter Controls */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-transform: capitalize;
        }

        .filter-btn:hover {
            background: #f1f5f9;
        }

        .filter-btn.active {
            background: #4f46e5;
            color: #ffffff;
            border-color: #4f46e5;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* Product Card */
        .product-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .product-image-link {
            display: block;
            width: 100%;
            height: 260px;
            background-color: #f1f5f9;
            overflow: hidden;
        }

        .product-image-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .tag {
            align-self: flex-start;
            background-color: #e0e7ff;
            color: #4338ca;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .product-info h3 {
            font-size: 16px;
            margin: 0 0 8px 0;
            color: #1e293b;
        }

        .product-info p {
            font-size: 13px;
            color: #64748b;
            margin: 0 0 16px 0;
            line-height: 1.4;
            flex-grow: 1;
        }

        .card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .price {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
        }

        .btn {
            display: inline-block;
            padding: 8px 14px;
            background-color: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #4338ca;
        }

        .section-title {
            font-size: 22px;
            margin: 32px 0 16px;
        }
    </style>
</head>

        <h2 class="section-title">Featured Products</h2>
        <div class="product-grid">
            <article v-for="product in featuredProducts" :key="'featured-' + product.id" class="product-card">
                <a :href="'product.html?id=' + product.id" class="product-image-link">
                    <img :src="product.image" :alt="product.name" loading="lazy">
                </a>

                <div class="product-info">
                    <span class="tag">{{ product.category }}</span>
                    <h3>{{ product.name }}</h3>
                    <p>{{ product.description }}</p>

                    <div class="card-bottom">
                        <strong class="price">{{ product.price }}</strong>
                        <a class="btn btn-small" :href="'product.html?id=' + product.id">
                            View Details
                        </a>
                    </div>
                </div>
            </article>
        </div>

        <!-- Main Section with Category Filters -->
        <h2 class="section-title">All Products</h2>

        <!-- Dynamic Category Filter Buttons -->
        <div class="filter-bar">
            <button v-for="cat in categories" :key="cat" class="filter-btn" :class="{ active: currentCategory === cat }"

                {{ cat }}
            </button>
        </div>

        </div>
