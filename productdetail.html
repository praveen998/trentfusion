<body>

  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <img src="images/Logo.jpg" alt="Trend Fusion by Lakshmi Bags Logo" style="height: 70px; width: auto; display: block;">
        <span class="brand-fallback">TREND FUSION</span>
      </a>
      <button class="menu-toggle" aria-label="Open navigation">☰</button>
      <nav class="nav" id="mainNav" aria-label="Main Navigation">
        <a href="index.html">Home</a>
        <a class="active" href="products.html">Products</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <!-- Vue Mount Container -->
      <div class="container" id="productDetail">

        <template v-if="product">
          <a class="back-link" href="products.html">← Back to Products</a>

          <div class="product-detail">
            <div class="detail-image-wrap">
              <img :src="getProductImage(product)" :alt="product.name || product.title || 'Trend Fusion Bag'">
            </div>

            <div class="detail-info">
              <span class="tag">{{ product.category }}</span>
              <h1>{{ product.name || product.title }}</h1>
              <div class="detail-price">{{ formatPrice(product.price) }}</div>
              <p class="lead">{{ product.description }}</p>

              <h3 v-if="product.details && product.details.length">Product Details</h3>
              <ul class="detail-list" v-if="product.details && product.details.length">
                <li v-for="(item, index) in product.details" :key="index">
                  {{ item }}
                </li>
              </ul>

              <a class="btn whatsapp-btn" :href="whatsappUrl" target="_blank" rel="noopener">
                Buy / Enquire on WhatsApp
              </a>

              <p class="small-note">
                Direct order assistance via WhatsApp • Fast response
              </p>
            </div>
          </div>
        </template>

      </div>
    </section>
  </main>

  <a class="whatsapp-float"
    href="https://wa.me/919846124945?text=Hello%20Trend%20Fusion%2C%20I%20would%20like%20to%20contact%20you."
    target="_blank" rel="noopener" aria-label="Chat on WhatsApp" title="Chat on WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>

      </div>
      <div>
        <h3>Quick Links</h3>
        <a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About Us</a><a
          href="contact.html">Contact</a><a href="admin.html">Admin</a>
      </div>
      <div>
        <h3>Contact</h3>
        <p><a href="tel:+919846124945">98461 24945</a></p>
        <p><a href="tel:+917994479719">79944 79719</a></p>
        <p>Thalore, Thrissur, Kerala</p>
      </div>
    </div>
    <div class="copyright">
      © <span id="year"></span> Trend Fusion by Lakshmi Bags. All rights reserved.
    </div>
  </footer>

  <!-- Website functions -->
  <script src="js/script.js"></script>

  <!-- Vue 3 Instance -->
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          API_BASE_URL: 'https://api.trendfusion.cc',
          phone: "919846124945",
          product: null,
          products: [
            {
              id: 1,
              name: "Cloth Tote Bag",
              category: "tote",
              price: 360,
              image_url: "/images/products/product-01.jpg",
              description: "Cloth tote bag with double handle. Premium quality cloth, spacious and durable, with a practical everyday design.",
              details: [
                "Premium quality cloth",
                "Spacious & durable",
                "Eco-friendly choice",
                "Double handle for extra comfort"
              ]
            }
          ]
        };
      },

      computed: {
        whatsappUrl() {
          if (!this.product) return '#';
          const title = this.product.name || this.product.title || 'Bag';
          const priceStr = this.formatPrice(this.product.price);
          const message = `Hello Trend Fusion, I am interested in the "${title}" (${priceStr}). Please share availability and more details.`;
          return `https://wa.me/${this.phone}?text=${encodeURIComponent(message)}`;
        }
      },

      methods: {
        getProductImage(product) {
          if (product && product.image_url) {
            return product.image_url.startsWith('http')
              ? product.image_url
              : `${this.API_BASE_URL}${product.image_url}`;
          }
          if (product && product.image) {
            return product.image;
          }
          return 'images/products/product-01.jpg';
        },

        formatPrice(price) {
          if (typeof price === 'number') {
            return `₹${price.toFixed(2)}`;
          }
          return price || '₹0';
        },

        loadProductData() {
          const savedProduct = localStorage.getItem('selected_product');
          if (savedProduct) {
            try {
              this.product = JSON.parse(savedProduct);
            } catch (e) {
              console.error('Error parsing selected_product:', e);
            }
          }

          if (!this.product) {
            const params = new URLSearchParams(window.location.search);
            const id = Number(params.get("id")) || 1;

            let sourceProducts = [];
            const cached = localStorage.getItem('cached_products');
            if (cached) {
              try {
                sourceProducts = JSON.parse(cached);
              } catch (e) {
                console.error('Error parsing cached_products:', e);
              }
            }

            if (!sourceProducts.length) {
              sourceProducts = (typeof window.products !== 'undefined' && window.products.length)
                ? window.products
                : this.products;
            }

            this.product = sourceProducts.find(item => Number(item.id) === id) || sourceProducts[0];
          }

          this.updatePageSEOMetadata();
        },

        updatePageSEOMetadata() {
          if (!this.product) return;

          const titleName = this.product.name || this.product.title || 'Product';
          const pageTitle = `${titleName} | Trend Fusion by Lakshmi Bags`;
          document.title = pageTitle;

          const metaDesc = document.querySelector('meta[name="description"]');
          if (metaDesc && this.product.description) {
            metaDesc.setAttribute('content', `${titleName} - ${this.product.description}`);
          }

          const ogTitle = document.getElementById('og-title');
          if (ogTitle) ogTitle.setAttribute('content', pageTitle);

          const ogImage = document.getElementById('og-image');
          if (ogImage) ogImage.setAttribute('content', this.getProductImage(this.product));
        }
      },

      mounted() {
        this.loadProductData();

        const yearEl = document.getElementById('year');
        if (yearEl) {
          yearEl.textContent = new Date().getFullYear();
        }
      }
    }).mount('#productDetail');
  </script>

</body>

</html>
